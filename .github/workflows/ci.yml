name: CI/CD Pipeline - Hipoteca Inversa CL

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ============================================================================
  # ETAPA 1: PRUEBAS AUTOMATIZADAS (UNITARIAS, API, SEGURIDAD Y PLAYWRIGHT E2E)
  # ============================================================================
  automated-tests:
    name: Pruebas Unitarias, API, Seguridad SQL y Playwright E2E
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hipoteca_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 1. Clonar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov playwright pytest-playwright
          python -m playwright install --with-deps chromium

      - name: 4. Inicializar esquema y tablas en PostgreSQL
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: hipoteca_db
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: |
          python sql/create_tables.py

      - name: 5. Ejecutar 37 pruebas unitarias, de API y de inyección SQL
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: hipoteca_db
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: |
          pytest tests/test_calculo.py tests/test_api_endpoints.py tests/test_seguridad_sql.py -v --junitxml=test-results.xml

      - name: 6. Ejecutar pruebas End-to-End con Playwright (Chromium)
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: hipoteca_db
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: |
          pytest tests/test_playwright_e2e.py -v

  # ============================================================================
  # ETAPA 2: VALIDACIÓN DECLARATIVA DE MANIFIESTOS KUBERNETES (GITOPS)
  # Se valida contra los esquemas oficiales de Kubernetes con kubeconform,
  # sin necesitar un cluster activo (kubectl apply --dry-run sí lo necesita).
  # ============================================================================
  validate-k8s:
    name: Validación Declarativa de Manifiestos K8s (k8s/)
    runs-on: ubuntu-latest
    needs: [automated-tests]
    steps:
      - name: 1. Clonar repositorio
        uses: actions/checkout@v4

      - name: 2. Instalar kubectl y kubeconform
        run: |
          curl -sSLo kubectl "https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl"
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform

      - name: 3. Preparar Secret de ejemplo (el real no se versiona en Git)
        run: cp k8s/postgres-secret.env.example k8s/postgres-secret.env

      - name: 4. Renderizar Kustomize y validar esquemas de Kubernetes
        run: |
          kubectl kustomize k8s/ > rendered.yaml
          kubeconform -strict -summary -kubernetes-version 1.30.0 rendered.yaml

  # ============================================================================
  # ETAPA 3: COMPILACIÓN, ETIQUETADO Y PUBLICACIÓN DE IMÁGENES EN DOCKERHUB
  # En push a main se publican las imágenes (requiere los secrets del repo
  # DOCKERHUB_USERNAME y DOCKERHUB_TOKEN). En PR solo se compilan.
  # ============================================================================
  docker-build:
    name: Compilación y Publicación de Imágenes Docker
    runs-on: ubuntu-latest
    needs: [automated-tests, validate-k8s]
    env:
      PUBLICAR: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: 1. Clonar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Iniciar sesión en DockerHub
        if: env.PUBLICAR == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 4. Compilar (y publicar) Backend con etiquetas semánticas y de commit
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ env.PUBLICAR == 'true' }}
          tags: |
            dduque642/hipoteca-inversa-backend:latest
            dduque642/hipoteca-inversa-backend:v2.0.0
            dduque642/hipoteca-inversa-backend:sha-${{ github.sha }}

      - name: 5. Compilar (y publicar) Frontend con etiquetas semánticas y de commit
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ env.PUBLICAR == 'true' }}
          tags: |
            dduque642/hipoteca-inversa-frontend:latest
            dduque642/hipoteca-inversa-frontend:v2.0.0
            dduque642/hipoteca-inversa-frontend:sha-${{ github.sha }}

      - name: 6. Resumen de artefactos
        run: |
          echo "Publicado en DockerHub: ${{ env.PUBLICAR }}"
          echo "Tag de trazabilidad: sha-${{ github.sha }}"

  # ============================================================================
  # ETAPA 4: QUALITY GATE & PREVENCIÓN DE PROMOCIÓN ANTE FALLAS
  # Este job solo se ejecuta si TODAS las etapas anteriores pasan (needs).
  # Si una prueba o la validación K8s falla, no hay publicación ni despliegue.
  # ============================================================================
  quality-gate:
    name: Control de Calidad y Autorización de Despliegue
    runs-on: ubuntu-latest
    needs: [automated-tests, validate-k8s, docker-build]
    steps:
      - name: Verificar aprobación integral
        run: |
          echo "=================================================================="
          echo " ✅ QUALITY GATE SUPERADO:"
          echo "    - Pruebas unitarias, de API, seguridad SQL y Playwright E2E"
          echo "    - Manifiestos de Kubernetes validados (kubeconform)"
          echo "    - Imágenes Docker construidas con tag sha-${{ github.sha }}"
          echo "=================================================================="

  # ============================================================================
  # ETAPA 5: ACTUALIZACIÓN DECLARATIVA DEL MANIFIESTO (GITOPS)
  # Fija en k8s/kustomization.yaml la imagen exacta publicada (sha-<commit>)
  # y lo versiona en Git, que es la fuente de verdad del despliegue.
  # ============================================================================
  update-manifests:
    name: Fijar imagen sha-<commit> en k8s/kustomization.yaml
    runs-on: ubuntu-latest
    needs: [quality-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    env:
      PUBLICADO: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: 1. Clonar repositorio
        if: env.PUBLICADO == 'true'
        uses: actions/checkout@v4

      - name: 2. Actualizar tags de imagen y hacer commit
        if: env.PUBLICADO == 'true'
        run: |
          cd k8s
          kustomize edit set image \
            dduque642/hipoteca-inversa-backend=dduque642/hipoteca-inversa-backend:sha-${{ github.sha }} \
            dduque642/hipoteca-inversa-frontend=dduque642/hipoteca-inversa-frontend:sha-${{ github.sha }}
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git diff --cached --quiet && exit 0
          git commit -m "deploy: fijar imágenes sha-${{ github.sha }} [skip ci]"
          git push
