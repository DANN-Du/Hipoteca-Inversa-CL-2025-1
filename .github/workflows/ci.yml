name: CI/CD Pipeline - Hipoteca Inversa CL

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ============================================================================
  # ETAPA 1: PRUEBAS AUTOMATIZADAS (UNITARIAS, API, SEGURIDAD Y PLAYWRIGHT E2E)
  # ============================================================================
  automated-tests:
    name: Pruebas Unitarias, API, Seguridad SQL y Playwright E2E
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hipoteca_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 1. Clonar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov playwright pytest-playwright
          python -m playwright install --with-deps chromium

      - name: 4. Inicializar esquema y tablas en PostgreSQL
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: hipoteca_db
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: |
          python sql/create_tables.py

      - name: 5. Ejecutar 37 pruebas unitarias, de API y de inyección SQL
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: hipoteca_db
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: |
          pytest tests/test_calculo.py tests/test_api_endpoints.py tests/test_seguridad_sql.py -v --junitxml=test-results.xml

      - name: 6. Ejecutar pruebas End-to-End con Playwright (Chromium)
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: hipoteca_db
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: |
          pytest tests/test_playwright_e2e.py -v

  # ============================================================================
  # ETAPA 2: VALIDACIÓN DECLARATIVA DE MANIFIESTOS KUBERNETES (GITOPS)
  # ============================================================================
  validate-k8s:
    name: Validación Declarativa de Manifiestos K8s (k8s/)
    runs-on: ubuntu-latest
    needs: [automated-tests]
    steps:
      - name: 1. Clonar repositorio
        uses: actions/checkout@v4

      - name: 2. Instalar kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: 3. Validar sintaxis y esquema de manifiestos K8s (--dry-run=client)
        run: |
          kubectl kustomize k8s/
          kubectl apply -k k8s/ --dry-run=client

  # ============================================================================
  # ETAPA 3: COMPILACIÓN Y ETIQUETADO DE IMÁGENES DOCKER (DOCKERHUB TAGS)
  # ============================================================================
  docker-build:
    name: Compilación y Versionado de Imágenes Docker
    runs-on: ubuntu-latest
    needs: [automated-tests]
    steps:
      - name: 1. Clonar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Compilar Backend con etiquetas semánticas y de commit
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: |
            dduque642/hipoteca-inversa-backend:latest
            dduque642/hipoteca-inversa-backend:v2.0.0
            dduque642/hipoteca-inversa-backend:sha-${{ github.sha }}

      - name: 4. Compilar Frontend con etiquetas semánticas y de commit
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: |
            dduque642/hipoteca-inversa-frontend:latest
            dduque642/hipoteca-inversa-frontend:v2.0.0
            dduque642/hipoteca-inversa-frontend:sha-${{ github.sha }}

  # ============================================================================
  # ETAPA 4: QUALITY GATE & PREVENCIÓN DE PROMOCIÓN ANTE FALLAS
  # ============================================================================
  quality-gate:
    name: Control de Calidad y Autorización de Despliegue
    runs-on: ubuntu-latest
    needs: [automated-tests, validate-k8s, docker-build]
    steps:
      - name: Verificar aprobación integral
        run: |
          echo "=================================================================="
          echo " ✅ QUALITY GATE SUPERADO:"
          echo "    - 37 Pruebas Unitarias y de Seguridad Aprobadas"
          echo "    - 3 Pruebas Playwright E2E Aprobadas"
          echo "    - Manifiestos de Kubernetes Validados"
          echo "    - Artefactos Docker Construidos con Trazabilidad (SHA: ${{ github.sha }})"
          echo "    - El cambio es apto para reconciliación GitOps en Minikube."
          echo "=================================================================="
