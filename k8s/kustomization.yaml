apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hipoteca-inversa

resources:
  - namespace.yaml
  - postgres-configmap.yaml
  - postgres-init-configmap.yaml
  - postgres-pvc.yaml
  - postgres-deployment.yaml
  - postgres-service.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - ingress.yaml

# El Secret se genera a partir de k8s/postgres-secret.env (ignorado por Git).
# Plantilla: k8s/postgres-secret.env.example
secretGenerator:
  - name: postgres-secret
    type: Opaque
    envs:
      - postgres-secret.env
    options:
      labels:
        app: postgres
        tier: database

generatorOptions:
  disableNameSuffixHash: true

# Imágenes desplegadas: el CI reemplaza newTag por sha-<commit> tras publicar
# en DockerHub, de modo que cada pod se puede rastrear hasta su commit.
images:
  - name: dduque642/hipoteca-inversa-backend
    newTag: v2.0.0
  - name: dduque642/hipoteca-inversa-frontend
    newTag: v2.0.0

labels:
  - pairs:
      app.kubernetes.io/part-of: hipoteca-inversa-cl
      app.kubernetes.io/managed-by: gitops
