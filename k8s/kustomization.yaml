apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hipoteca-inversa

resources:
  - namespace.yaml
  # postgres-secret.yaml se genera localmente desde postgres-secret.example.yaml
  # (está en .gitignore: las credenciales no se suben a Git)
  - postgres-secret.yaml
  - postgres-configmap.yaml
  - postgres-init-configmap.yaml
  - postgres-pvc.yaml
  - postgres-deployment.yaml
  - postgres-service.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - ingress.yaml

# Imágenes desplegadas (publicadas por el CI en DockerHub con tags latest,
# v2.0.0 y sha-<commit>).
images:
  - name: juanchito1527/hipoteca-inversa-backend
    newTag: v2.0.0
  - name: juanchito1527/hipoteca-inversa-frontend
    newTag: v2.0.0

labels:
  - pairs:
      app.kubernetes.io/part-of: hipoteca-inversa-cl
      app.kubernetes.io/managed-by: gitops
