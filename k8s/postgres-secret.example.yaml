# Plantilla del Secret de PostgreSQL (se versiona en Git; NO contiene credenciales reales).
# scripts/deploy-minikube.ps1 / .sh la copian como k8s/postgres-secret.yaml con una
# contrasena aleatoria. k8s/postgres-secret.yaml esta en .gitignore y NUNCA se sube a Git.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: hipoteca-inversa
  labels:
    app: postgres
    tier: database
type: Opaque
stringData:
  POSTGRES_DB: "hipoteca_db"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "CAMBIAR_ESTA_CONTRASENA"
  DB_PASSWORD: "CAMBIAR_ESTA_CONTRASENA"
