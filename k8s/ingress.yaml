apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hipoteca-ingress
  namespace: hipoteca-inversa
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  rules:
    - host: hipoteca.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
