server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Servir archivos estáticos del Frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso para comunicar Frontend con la API del Backend en el contenedor
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy para Swagger OpenAPI UI
    location /apidocs/ {
        proxy_pass http://backend:5000/apidocs/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /flasgger_static/ {
        proxy_pass http://backend:5000/flasgger_static/;
        proxy_set_header Host $host;
    }

    location /apispec_1.json {
        proxy_pass http://backend:5000/apispec_1.json;
        proxy_set_header Host $host;
    }
}
